<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen Social — Instagram Carousel Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* ══════════════════════════════════════════
   DESIGN TOKENS
══════════════════════════════════════════ */
:root {
  /* Accent — the one colour */
  --orange: #F04E00;
  --orange-dim: rgba(240,78,0,0.12);
  --orange-faint: rgba(240,78,0,0.06);

  /* Light mode */
  --bg:        #F6F2EC;
  --bg-panel:  #FDFAF6;
  --bg-card:   #FFFFFF;
  --bg-input:  #FDFAF6;
  --bg-chip:   #EDE9E2;
  --text:      #111111;
  --text-2:    #555550;
  --text-3:    #999990;
  --border:    #111111;
  --border-soft: #DDD9D2;
  --shadow-card: 4px 4px 0px #111111;
  --shadow-btn:  3px 3px 0px #111111;
  --shadow-lg:   6px 6px 0px #111111;
  --shadow-modal:8px 8px 0px #111111;

  /* Dot texture */
  --dot-color: rgba(0,0,0,0.07);

  /* Typography */
  --font-head: 'Syne', 'Arial Black', sans-serif;
  --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;

  /* Geometry */
  --radius: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
}

[data-theme="dark"] {
  --bg:        #111111;
  --bg-panel:  #181818;
  --bg-card:   #1F1F1F;
  --bg-input:  #181818;
  --bg-chip:   #2A2A2A;
  --text:      #F0EDE8;
  --text-2:    #9D9D95;
  --text-3:    #5A5A54;
  --border:    #F0EDE8;
  --border-soft: #2E2E2E;
  --shadow-card: 4px 4px 0px rgba(240,237,232,0.18);
  --shadow-btn:  3px 3px 0px rgba(240,237,232,0.18);
  --shadow-lg:   6px 6px 0px rgba(240,237,232,0.18);
  --shadow-modal:8px 8px 0px rgba(240,237,232,0.18);
  --dot-color: rgba(255,255,255,0.04);
  --orange-dim: rgba(240,78,0,0.18);
  --orange-faint: rgba(240,78,0,0.08);
}

/* ══════════════════════════════════════════
   RESET & BASE
══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 14px; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  /* Dotted texture */
  background-image: radial-gradient(circle, var(--dot-color) 1.2px, transparent 1.2px);
  background-size: 22px 22px;
}

button  { font-family: var(--font-body); cursor: pointer; border: none; outline: none; }
input, textarea, select { font-family: var(--font-body); outline: none; }
a { color: inherit; text-decoration: none; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 2px; }

/* ══════════════════════════════════════════
   TOP BAR
══════════════════════════════════════════ */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 58px;
  background: var(--bg-panel);
  border-bottom: 1.5px solid var(--border);
  flex-shrink: 0; z-index: 100;
}

.topbar-brand { display: flex; align-items: center; gap: 12px; }

.topbar-logo {
  width: 34px; height: 34px;
  background: var(--orange);
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-btn);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head);
  font-size: 17px; font-weight: 800; color: #fff;
  flex-shrink: 0;
}

.topbar-name {
  font-family: var(--font-head);
  font-size: 18px; font-weight: 800;
  letter-spacing: -0.5px; color: var(--text);
}
.topbar-name span { color: var(--orange); }

.topbar-pills { display: flex; gap: 4px; }

.pill {
  padding: 5px 14px;
  font-family: var(--font-body);
  font-size: 12px; font-weight: 600;
  background: transparent;
  border: 1.5px solid var(--border-soft);
  color: var(--text-2);
  cursor: pointer; transition: all .12s;
}
.pill:hover { border-color: var(--border); color: var(--text); }
.pill.active {
  background: var(--text); color: var(--bg);
  border-color: var(--text);
}

.topbar-right { display: flex; align-items: center; gap: 10px; }

.btn-ghost {
  padding: 7px 16px;
  font-size: 12px; font-weight: 600;
  background: transparent;
  border: 1.5px solid var(--border-soft);
  color: var(--text-2);
  cursor: pointer; transition: all .12s;
}
.btn-ghost:hover { border-color: var(--border); color: var(--text); }

.btn-primary {
  padding: 8px 20px;
  font-family: var(--font-body);
  font-size: 12px; font-weight: 700;
  background: var(--orange); color: #fff;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-btn);
  cursor: pointer; transition: transform .1s, box-shadow .1s;
  letter-spacing: 0.2px;
}
.btn-primary:hover  { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--border); }
.btn-primary:active { transform: translate(1px,1px);  box-shadow: 2px 2px 0 var(--border); }

.theme-toggle {
  width: 34px; height: 34px;
  background: var(--bg-chip);
  border: 1.5px solid var(--border-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; cursor: pointer; transition: all .12s;
  flex-shrink: 0;
}
.theme-toggle:hover { border-color: var(--border); }

.avatar {
  width: 32px; height: 32px;
  background: var(--text);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head);
  font-size: 13px; font-weight: 800;
  color: var(--bg); flex-shrink: 0;
  border: 1.5px solid var(--border);
}

/* ══════════════════════════════════════════
   MAIN 3-COLUMN LAYOUT
══════════════════════════════════════════ */
.main { display: flex; flex: 1; overflow: hidden; }

/* ══════════════════════════════════════════
   LEFT PANEL — BRAND KIT
══════════════════════════════════════════ */
.panel-brand {
  width: 272px; flex-shrink: 0;
  background: var(--bg-panel);
  border-right: 1.5px solid var(--border);
  display: flex; flex-direction: column;
  overflow-y: auto;
}

.panel-header {
  padding: 20px 20px 16px;
  border-bottom: 1.5px solid var(--border-soft);
  flex-shrink: 0;
}

.panel-label {
  font-family: var(--font-head);
  font-size: 11px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-3); margin-bottom: 12px;
}

.brand-url-row { display: flex; gap: 0; }

.brand-url-input {
  flex: 1;
  background: var(--bg-input);
  border: 1.5px solid var(--border);
  border-right: none;
  padding: 8px 10px;
  color: var(--text); font-size: 12px;
  transition: border-color .12s;
}
.brand-url-input:focus { border-color: var(--orange); }
.brand-url-input::placeholder { color: var(--text-3); }

.btn-fetch {
  padding: 8px 14px;
  font-size: 12px; font-weight: 700;
  background: var(--text); color: var(--bg);
  border: 1.5px solid var(--border);
  cursor: pointer; white-space: nowrap;
  transition: background .12s;
}
.btn-fetch:hover { background: var(--orange); border-color: var(--orange); color: #fff; }

/* ── Brand sub-sections ── */
.brand-section {
  padding: 16px 20px;
  border-bottom: 1.5px solid var(--border-soft);
}

.section-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.section-label {
  font-size: 10px; font-weight: 600;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--text-3);
}
.section-action {
  font-size: 11px; font-weight: 600; color: var(--orange);
  background: none; border: none; padding: 0; cursor: pointer;
}
.section-action:hover { text-decoration: underline; }

/* Colour swatches */
.color-swatches { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-end; }

.swatch-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }

.swatch {
  width: 28px; height: 28px;
  border: 1.5px solid var(--border-soft);
  transition: all .12s; position: relative;
}
.swatch:hover { transform: translate(-1px,-1px); box-shadow: 2px 2px 0 var(--border); }
.swatch.selected {
  border-color: var(--border);
  box-shadow: 2px 2px 0 var(--orange);
  transform: translate(-1px,-1px);
}
.swatch-label { font-size: 8px; color: var(--text-3); font-weight: 500; }

.swatch-add {
  width: 28px; height: 28px;
  border: 1.5px dashed var(--border-soft);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3); font-size: 16px; cursor: pointer;
  transition: all .12s;
}
.swatch-add:hover { border-color: var(--orange); color: var(--orange); }

/* Font list */
.font-list { display: flex; flex-direction: column; gap: 5px; }

.font-item {
  background: var(--bg-chip);
  border: 1.5px solid transparent;
  padding: 8px 10px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; transition: all .12s;
}
.font-item:hover { border-color: var(--border-soft); }
.font-item.active {
  border-color: var(--border);
  background: var(--bg-card);
  box-shadow: var(--shadow-btn);
}
.font-meta { display: flex; flex-direction: column; gap: 1px; }
.font-name-label { font-size: 12px; font-weight: 600; color: var(--text); }
.font-role-label { font-size: 10px; color: var(--text-3); font-weight: 500; }
.font-preview-text { font-size: 16px; color: var(--text-2); line-height: 1; }

/* Vibe tags */
.vibe-tags { display: flex; flex-wrap: wrap; gap: 5px; }

.vibe-tag {
  padding: 4px 10px;
  font-size: 11px; font-weight: 600;
  background: var(--bg-chip);
  border: 1.5px solid transparent;
  color: var(--text-2);
  cursor: pointer; transition: all .12s;
}
.vibe-tag:hover { border-color: var(--border-soft); color: var(--text); }
.vibe-tag.active {
  background: var(--orange-dim);
  border-color: var(--orange);
  color: var(--orange);
}

/* Photo grid */
.photos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

.photo-item {
  aspect-ratio: 1; overflow: hidden;
  background: var(--bg-chip);
  border: 1.5px solid var(--border-soft);
  cursor: pointer; transition: all .12s; position: relative;
}
.photo-item:hover { border-color: var(--border); box-shadow: var(--shadow-btn); transform: translate(-1px,-1px); }
.photo-item.selected::after {
  content: '✓';
  position: absolute; inset: 0;
  background: rgba(240,78,0,0.45);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: #fff; font-weight: 800;
}
.photo-item canvas { width: 100%; height: 100%; display: block; }

.photo-add {
  aspect-ratio: 1;
  border: 1.5px dashed var(--border-soft);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; transition: all .12s;
  color: var(--text-3); font-size: 10px; font-weight: 600;
  background: var(--bg-chip);
}
.photo-add:hover { border-color: var(--orange); color: var(--orange); }
.photo-add-icon { font-size: 20px; }

.detected-badge {
  padding: 2px 7px;
  font-size: 10px; font-weight: 600;
  background: var(--orange-dim);
  color: var(--orange);
  border: 1.5px solid var(--orange);
}

/* ══════════════════════════════════════════
   CENTER — POST BUILDER
══════════════════════════════════════════ */
.panel-posts {
  flex: 1; display: flex; flex-direction: column;
  background: transparent; overflow: hidden;
}

/* Prompt bar */
.posts-input-area {
  padding: 20px 24px 16px;
  border-bottom: 1.5px solid var(--border);
  background: var(--bg-panel);
  flex-shrink: 0;
}

.prompt-label {
  font-family: var(--font-head);
  font-size: 20px; font-weight: 800;
  letter-spacing: -0.5px; color: var(--text);
  margin-bottom: 14px;
}

.posts-input-row { display: flex; gap: 0; align-items: stretch; }

.post-prompt {
  flex: 1;
  background: var(--bg-input);
  border: 1.5px solid var(--border);
  border-right: none;
  padding: 12px 14px; color: var(--text);
  font-size: 13px; resize: none; line-height: 1.55;
  min-height: 70px; transition: border-color .12s;
}
.post-prompt:focus { border-color: var(--orange); }
.post-prompt::placeholder { color: var(--text-3); }

.prompt-side { display: flex; flex-direction: column; }

.count-select {
  background: var(--bg-chip);
  border: 1.5px solid var(--border);
  border-bottom: none;
  padding: 0 10px; color: var(--text);
  font-size: 12px; font-weight: 600;
  cursor: pointer; height: 36px; min-width: 100px;
}
.count-select:focus { border-color: var(--orange); }

.btn-generate {
  flex: 1;
  padding: 0 22px;
  font-family: var(--font-head);
  font-size: 14px; font-weight: 800;
  background: var(--orange); color: #fff;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-btn);
  cursor: pointer; transition: transform .1s, box-shadow .1s;
  white-space: nowrap; min-width: 130px;
  letter-spacing: 0.2px;
}
.btn-generate:hover  { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--border); }
.btn-generate:active { transform: translate(1px,1px);  box-shadow: 1px 1px 0 var(--border); }
.btn-generate:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: var(--shadow-btn); }

.posts-meta {
  display: flex; align-items: center; gap: 10px;
  margin-top: 12px; flex-wrap: wrap;
}
.meta-text { font-size: 11px; color: var(--text-3); font-weight: 500; }
.meta-text strong { color: var(--text-2); font-weight: 600; }

.meta-chip {
  padding: 3px 9px;
  font-size: 10px; font-weight: 600;
  background: var(--bg-chip);
  border: 1px solid var(--border-soft);
  color: var(--text-2);
}

/* Posts list */
.posts-list {
  flex: 1; overflow-y: auto;
  padding: 20px 24px;
  display: flex; flex-direction: column; gap: 12px;
}

/* ── Post card ── */
.post-card {
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-card);
  transition: transform .12s, box-shadow .12s;
  cursor: pointer;
}
.post-card:hover {
  transform: translate(-2px,-2px);
  box-shadow: 6px 6px 0 var(--border);
}
.post-card.expanded {
  transform: none;
  box-shadow: var(--shadow-card);
  border-color: var(--orange);
}
.post-card.expanded:hover { transform: none; }

.post-card-header {
  padding: 16px 18px;
  display: flex; align-items: flex-start; gap: 14px;
}

.post-num {
  width: 26px; height: 26px; flex-shrink: 0;
  background: var(--orange-dim);
  border: 1.5px solid var(--orange);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head);
  font-size: 12px; font-weight: 800; color: var(--orange);
  margin-top: 1px;
}

.post-info { flex: 1; min-width: 0; }

.post-concept {
  font-family: var(--font-head);
  font-size: 14px; font-weight: 800;
  color: var(--text); margin-bottom: 6px; line-height: 1.25;
  letter-spacing: -0.2px;
}

.post-tags { display: flex; gap: 5px; flex-wrap: wrap; }

.post-tag {
  padding: 2px 8px;
  font-size: 10px; font-weight: 600;
  background: var(--bg-chip);
  border: 1px solid var(--border-soft);
  color: var(--text-3);
}

.post-card-actions {
  display: flex; gap: 6px; align-items: flex-start; flex-shrink: 0;
}

.btn-icon {
  width: 30px; height: 30px;
  background: var(--bg-chip);
  border: 1.5px solid var(--border-soft);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .12s;
  font-size: 12px; color: var(--text-2);
}
.btn-icon:hover { border-color: var(--border); color: var(--text); box-shadow: var(--shadow-btn); transform: translate(-1px,-1px); }

.btn-make-images {
  padding: 6px 14px;
  font-size: 11px; font-weight: 700;
  background: var(--text); color: var(--bg);
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-btn);
  cursor: pointer; transition: all .12s; white-space: nowrap;
}
.btn-make-images:hover {
  background: var(--orange); border-color: var(--orange); color: #fff;
  transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--border);
}

/* Expanded body */
.post-body {
  padding: 0 18px 18px;
  border-top: 1.5px solid var(--border-soft);
  margin-top: 0;
}
.post-body-inner { padding-top: 16px; }

.caption-label {
  font-size: 10px; font-weight: 600;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--text-3); margin-bottom: 7px;
}

.caption-textarea {
  width: 100%;
  background: var(--bg-input);
  border: 1.5px solid var(--border-soft);
  padding: 10px 12px; color: var(--text);
  font-size: 12px; line-height: 1.6;
  resize: none; min-height: 72px;
  transition: border-color .12s;
}
.caption-textarea:focus { border-color: var(--orange); }

.caption-count { font-size: 10px; color: var(--text-3); text-align: right; margin-top: 4px; font-weight: 500; }

.slides-preview-row {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px;
  margin-top: 14px; margin-bottom: 14px;
}

.slide-thumb {
  flex-shrink: 0; width: 78px; height: 78px; overflow: hidden;
  border: 1.5px solid var(--border-soft);
  cursor: pointer; transition: all .12s; position: relative;
}
.slide-thumb:hover {
  border-color: var(--orange);
  transform: translate(-1px,-1px);
  box-shadow: 2px 2px 0 var(--border);
}
.slide-thumb canvas { width: 100%; height: 100%; display: block; }
.slide-num {
  position: absolute; bottom: 4px; right: 4px;
  font-size: 9px; font-weight: 700;
  color: rgba(255,255,255,0.9);
  background: rgba(0,0,0,0.55);
  padding: 1px 5px;
}

.post-footer {
  display: flex; align-items: center; justify-content: space-between;
}

.status-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-3); font-weight: 500; }

.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-soft); }
.status-dot.ready  { background: #22c55e; box-shadow: 0 0 5px rgba(34,197,94,0.4); }
.status-dot.pending { background: var(--orange); animation: pulse 1.4s infinite; }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

.btn-open-big {
  padding: 6px 14px;
  font-size: 11px; font-weight: 700;
  background: transparent;
  border: 1.5px solid var(--border-soft);
  color: var(--text-2);
  cursor: pointer; transition: all .12s;
}
.btn-open-big:hover {
  border-color: var(--border); color: var(--text);
  box-shadow: var(--shadow-btn); transform: translate(-1px,-1px);
}

/* ══════════════════════════════════════════
   RIGHT PANEL — SCHEDULE
══════════════════════════════════════════ */
.panel-schedule {
  width: 252px; flex-shrink: 0;
  background: var(--bg-panel);
  border-left: 1.5px solid var(--border);
  display: flex; flex-direction: column;
  overflow-y: auto;
}

.schedule-header {
  padding: 20px 18px 14px;
  border-bottom: 1.5px solid var(--border-soft);
  flex-shrink: 0;
}

.schedule-section-title {
  font-family: var(--font-head);
  font-size: 11px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-3);
}

/* Platform tabs */
.platform-row {
  display: flex;
  border-bottom: 1.5px solid var(--border-soft);
}
.platform-btn {
  flex: 1; padding: 9px 4px;
  font-size: 11px; font-weight: 600;
  background: transparent;
  border: none;
  border-right: 1.5px solid var(--border-soft);
  color: var(--text-3);
  cursor: pointer; transition: all .12s;
}
.platform-btn:last-child { border-right: none; }
.platform-btn:hover { color: var(--text); background: var(--bg-chip); }
.platform-btn.active {
  background: var(--orange-dim);
  color: var(--orange);
  font-weight: 700;
}

/* Calendar */
.calendar-mini {
  padding: 16px 18px;
  border-bottom: 1.5px solid var(--border-soft);
}

.cal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.cal-month {
  font-family: var(--font-head);
  font-size: 13px; font-weight: 800; color: var(--text);
  letter-spacing: -0.3px;
}
.cal-nav-wrap { display: flex; gap: 0; }
.cal-nav {
  width: 26px; height: 26px;
  background: var(--bg-chip);
  border: 1.5px solid var(--border-soft);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2); cursor: pointer; font-size: 13px;
  transition: all .12s;
}
.cal-nav:first-child { border-right: none; }
.cal-nav:hover { border-color: var(--border); color: var(--text); }

/* ════════════════════════════════════════════════════

const ORANGE = '#F04E00';
const CREAM  = '#F6F2EC';
const BLACK  = '#111111';
const WHITE  = '#FDFAF6';

function drawSlide(canvas, slide, idx, brand) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  const designs = {
    cover:     drawCoverSlide,
    feature:   drawFeatureSlide,
    stat:      drawStatSlide,
    lifestyle: drawLifestyleSlide,
    cta:       drawCtaSlide
  };
  (designs[slide.type] || drawFeatureSlide)(ctx, w, h, slide, idx, brand);
}

/* Dotted texture helper */
function drawDotTexture(ctx, w, h, color, spacing=18) {
  ctx.save();
  ctx.fillStyle = color;
  for (let x = spacing; x < w; x += spacing) {
    for (let y = spacing; y < h; y += spacing) {
      ctx.beginPath();
      ctx.arc(x, y, 1, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

/* Shared slide chrome */
function drawBrandTag(ctx, x, y, name) {
  ctx.save();
  ctx.font = `700 10px Inter, sans-serif`;
  const tw = ctx.measureText(name).width;
  const pw = 10, ph = 5, rh = 20;
  ctx.fillStyle = ORANGE;
  ctx.fillRect(x, y, tw + pw*2, rh);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText(name, x + pw, y + rh * 0.68);
  ctx.restore();
}

function drawSlideNumber(ctx, w, h, idx, total) {
  ctx.save();
  ctx.font = `600 10px Inter, sans-serif`;
  ctx.fillStyle = hexToRgba(BLACK, 0.4);
  ctx.textAlign = 'right';
  ctx.fillText(`${idx+1} / ${total}`, w - 16, h - 14);
  ctx.restore();
}

function drawNavDots(ctx, w, h, idx, total, color) {
  const r = 3, gap = 8;
  const total_w = total * r*2 + (total-1)*gap;
  const sx = (w - total_w) / 2;
  const y = h - 16;
  for (let i = 0; i < total; i++) {
    ctx.beginPath();
    ctx.arc(sx + i*(r*2+gap) + r, y, i===idx ? r+1 : r-1, 0, Math.PI*2);
    ctx.fillStyle = i===idx ? color : hexToRgba(color, 0.3);
    ctx.fill();
  }
}

/* COVER — dark background, big headline, orange rule */
function drawCoverSlide(ctx, w, h, slide, idx, brand) {
  /* bg */
  ctx.fillStyle = BLACK;
  ctx.fillRect(0, 0, w, h);
  drawDotTexture(ctx, w, h, 'rgba(255,255,255,0.04)');

  /* orange accent strip */
  ctx.fillStyle = ORANGE;
  ctx.fillRect(0, h * 0.46, w, 5);

  /* emoji */
  ctx.font = `${w * 0.14}px serif`;
  ctx.textAlign = 'left';
  ctx.fillText(slide.emoji, w * 0.07, h * 0.34);

  /* headline */
  ctx.fillStyle = WHITE;
  ctx.font = `800 ${w * 0.12}px Syne, Arial Black, sans-serif`;
  slide.headline.split('\n').forEach((ln, i) =>
    ctx.fillText(ln, w * 0.07, h * 0.5 + i * w * 0.13)
  );

  /* sub */
  ctx.fillStyle = hexToRgba(WHITE, 0.5);
  ctx.font = `500 ${w * 0.052}px Inter, sans-serif`;
  ctx.fillText(slide.sub, w * 0.07, h * 0.78);

  drawBrandTag(ctx, w * 0.07, h * 0.07, brand.name);
  drawNavDots(ctx, w, h, idx, 5, ORANGE);
}

/* FEATURE — cream bg, big emoji, bold text, left orange bar */
function drawFeatureSlide(ctx, w, h, slide, idx, brand) {
  ctx.fillStyle = CREAM;
  ctx.fillRect(0, 0, w, h);
  drawDotTexture(ctx, w, h, 'rgba(0,0,0,0.05)');

  /* left bar */
  ctx.fillStyle = ORANGE;
  ctx.fillRect(0, 0, 5, h);

  /* hard shadow box in upper right */
  const bx = w * 0.62, by = w * 0.05, bsz = w * 0.25;
  ctx.fillStyle = hexToRgba(BLACK, 0.06);
  ctx.fillRect(bx + 4, by + 4, bsz, bsz);
  ctx.fillStyle = WHITE;
  ctx.fillRect(bx, by, bsz, bsz);
  ctx.strokeStyle = hexToRgba(BLACK, 0.12);
  ctx.lineWidth = 1.5;
  ctx.strokeRect(bx, by, bsz, bsz);
  ctx.font = `${bsz * 0.55}px serif`;
  ctx.textAlign = 'center';
  ctx.fillStyle = BLACK;
  ctx.fillText(slide.emoji, bx + bsz * 0.5, by + bsz * 0.72);

  /* headline */
  ctx.fillStyle = BLACK;
  ctx.font = `800 ${w * 0.105}px Syne, Arial Black, sans-serif`;
  ctx.textAlign = 'left';
  slide.headline.split('\n').forEach((ln, i) =>
    ctx.fillText(ln, w * 0.08, h * 0.46 + i * w * 0.115)
  );

  /* sub */
  ctx.fillStyle = hexToRgba(BLACK, 0.45);
  ctx.font = `500 ${w * 0.05}px Inter, sans-serif`;
  ctx.fillText(slide.sub, w * 0.08, h * 0.74);

  drawBrandTag(ctx, w * 0.08, h * 0.85, brand.name);
  drawSlideNumber(ctx, w, h, idx, 5);
}

/* STAT — orange background, huge number */
function drawStatSlide(ctx, w, h, slide, idx, brand) {
  ctx.fillStyle = ORANGE;
  ctx.fillRect(0, 0, w, h);
  drawDotTexture(ctx, w, h, 'rgba(0,0,0,0.08)');

  /* stat */
  ctx.fillStyle = WHITE;
  ctx.font = `800 ${w * 0.26}px Syne, Arial Black, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(slide.headline, w * 0.5, h * 0.52);

  /* rule */
  ctx.fillStyle = hexToRgba(WHITE, 0.35);
  ctx.fillRect(w * 0.12, h * 0.57, w * 0.76, 2);

  /* sub */
  ctx.fillStyle = hexToRgba(WHITE, 0.85);
  ctx.font = `500 ${w * 0.054}px Inter, sans-serif`;
  ctx.fillText(slide.sub, w * 0.5, h * 0.68);

  /* emoji corner */
  ctx.font = `${w * 0.09}px serif`;
  ctx.textAlign = 'right';
  ctx.fillStyle = hexToRgba(WHITE, 0.7);
  ctx.fillText(slide.emoji, w - 20, 46);

  ctx.textAlign = 'left';
  drawBrandTag(ctx, 20, 20, brand.name);
  drawNavDots(ctx, w, h, idx, 5, WHITE);
}

/* LIFESTYLE — dark with grain, text at bottom */
function drawLifestyleSlide(ctx, w, h, slide, idx, brand) {
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, w, h);
  drawDotTexture(ctx, w, h, 'rgba(255,255,255,0.035)', 14);

  /* subtle orange corner accent */
  ctx.save();
  ctx.fillStyle = ORANGE;
  ctx.globalAlpha = 0.15;
  ctx.beginPath();
  ctx.arc(w, 0, w * 0.55, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  /* bottom text gradient */
  const grad = ctx.createLinearGradient(0, h*0.5, 0, h);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.85)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  /* emoji */
  ctx.font = `${w * 0.15}px serif`;
  ctx.textAlign = 'center';
  ctx.fillText(slide.emoji, w * 0.5, h * 0.46);

  /* headline */
  ctx.fillStyle = WHITE;
  ctx.font = `800 ${w * 0.1}px Syne, Arial Black, sans-serif`;
  slide.headline.split('\n').forEach((ln, i) =>
    ctx.fillText(ln, w * 0.5, h * 0.63 + i * w * 0.115)
  );

  /* sub */
  ctx.fillStyle = ORANGE;
  ctx.font = `500 ${w * 0.048}px Inter, sans-serif`;
  ctx.fillText(slide.sub, w * 0.5, h * 0.85);

  ctx.textAlign = 'left';
  drawBrandTag(ctx, 20, 20, brand.name);
  drawSlideNumber(ctx, w, h, idx, 5);
}

/* CTA — cream, orange box with invite */
function drawCtaSlide(ctx, w, h, slide, idx, brand) {
  ctx.fillStyle = CREAM;
  ctx.fillRect(0, 0, w, h);
  drawDotTexture(ctx, w, h, 'rgba(0,0,0,0.05)');

  /* big orange block offset */
  const bx = w * 0.06, by = h * 0.38, bw2 = w * 0.88, bh2 = h * 0.32;
  ctx.fillStyle = BLACK;
  ctx.fillRect(bx+5, by+5, bw2, bh2);
  ctx.fillStyle = ORANGE;
  ctx.fillRect(bx, by, bw2, bh2);

  /* headline inside block */
  ctx.fillStyle = WHITE;
  ctx.font = `800 ${w * 0.1}px Syne, Arial Black, sans-serif`;
  ctx.textAlign = 'center';
  slide.headline.split('\n').forEach((ln, i) =>
    ctx.fillText(ln, w * 0.5, by + bh2 * 0.38 + i * w * 0.105)
  );

  /* emoji above */
  ctx.font = `${w * 0.14}px serif`;
  ctx.fillText(slide.emoji, w * 0.5, h * 0.3);

  /* sub below block */
  ctx.fillStyle = hexToRgba(BLACK, 0.5);
  ctx.font = `500 ${w * 0.048}px Inter, sans-serif`;
  ctx.fillText(slide.sub, w * 0.5, by + bh2 + 26);

  ctx.textAlign = 'left';
  drawBrandTag(ctx, w * 0.06, h * 0.06, brand.name);
  drawSlideNumber(ctx, w, h, idx, 5);
}

/* ════════════════════════════════════════════════════
   UTILITIES
════════════════════════════════════════════════════ */
function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function shiftColor(hex, amt) {
  let r = Math.max(0,Math.min(255,parseInt(hex.slice(1,3),16)+amt));
  let g = Math.max(0,Math.min(255,parseInt(hex.slice(3,5),16)+amt));
  let b = Math.max(0,Math.min(255,parseInt(hex.slice(5,7),16)+amt));
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

/* ════════════════════════════════════════════════════
   RENDER POSTS
════════════════════════════════════════════════════ */
function renderPosts() {
  const list = document.getElementById('postsList');
  list.innerHTML = '';
  state.posts.forEach((post, pi) => {
    const card = document.createElement('div');
    card.className = `post-card${post.expanded ? ' expanded' : ''}`;
    card.innerHTML = `
      <div class="post-card-header" onclick="togglePost(${pi})">
        <div class="post-num">${pi+1}</div>
        <div class="post-info">
          <div class="post-concept">${post.concept}</div>
          <div class="post-tags">${post.tags.map(t=>`<span class="post-tag">${t}</span>`).join('')}</div>
        </div>
        <div class="post-card-actions" onclick="event.stopPropagation()">
          <button class="btn-icon" title="Duplicate" onclick="duplicatePost(${pi})">⧉</button>
          <button class="btn-icon" title="Delete" onclick="deletePost(${pi})">✕</button>
          <button class="btn-make-images" onclick="makeImages(${pi})">✦ Make Images</button>
        </div>
      </div>`;

    if (post.expanded) {
      const body = document.createElement('div');
      body.className = 'post-body';
      body.innerHTML = `
        <div class="post-body-inner">
          <div class="caption-label">Caption</div>
          <textarea class="caption-textarea" rows="4" id="caption-${pi}"
            oninput="updateCaption(${pi},this.value)">${post.caption}</textarea>
          <div class="caption-count" id="count-${pi}">${post.caption.length} / 2200</div>
          <div class="caption-label" style="margin-top:14px">Slide Previews</div>
          <div class="slides-preview-row" id="slides-row-${pi}"></div>
          <div class="post-footer">
            <div class="status-row">
              <div class="status-dot ${post.status}"></div>
              <span>${post.status === 'ready' ? 'Images ready' : 'Generating…'}</span>
            </div>
            <button class="btn-open-big" onclick="openModal(${pi})">⤢ Full View</button>
          </div>
        </div>`;
      card.appendChild(body);

      setTimeout(() => {
        const row = document.getElementById(`slides-row-${pi}`);
        if (!row) return;
        post.slides.forEach((sl, si) => {
          const wrap = document.createElement('div');
          wrap.className = 'slide-thumb';
          const c = document.createElement('canvas');
          c.width = 160; c.height = 160;
          wrap.appendChild(c);
          const num = document.createElement('div');
          num.className = 'slide-num';
          num.textContent = si+1;
          wrap.appendChild(num);
          wrap.onclick = () => openModal(pi, si);
          row.appendChild(wrap);
          drawSlide(c, sl, si, state.brand);
        });
      }, 0);
    }
    list.appendChild(card);
  });
}

function togglePost(pi) {
  state.posts[pi].expanded = !state.posts[pi].expanded;
  renderPosts();
}
function updateCaption(pi, val) {
  state.posts[pi].caption = val;
  const cnt = document.getElementById(`count-${pi}`);
  if (cnt) cnt.textContent = `${val.length} / 2200`;
}
function deletePost(pi) { state.posts.splice(pi,1); renderPosts(); toast('Post removed','info'); }
function duplicatePost(pi) {
  const copy = JSON.parse(JSON.stringify(state.posts[pi]));
  copy.concept = 'Copy of ' + copy.concept; copy.expanded = false;
  state.posts.splice(pi+1, 0, copy); renderPosts(); toast('Post duplicated','info');
}
function makeImages(pi) {
  state.posts[pi].status = 'pending'; state.posts[pi].expanded = true; renderPosts();
  setTimeout(() => { state.posts[pi].status = 'ready'; renderPosts(); toast('Images generated ✦','success'); }, 1800);
}

/* ════════════════════════════════════════════════════
   MODAL
════════════════════════════════════════════════════ */
function openModal(pi, si=0) {
  state.modal.postIdx = pi; state.modal.currentSlide = si;
  const post = state.posts[pi];
  document.getElementById('modalTitle').textContent = post.concept;
  document.getElementById('modalSubtitle').textContent = `${post.slides.length} slides · Instagram carousel`;
  const d = new Date(); d.setDate(d.getDate()+1); d.setHours(9,0,0,0);
  document.getElementById('scheduleTimeInput').value = d.toISOString().slice(0,16);
  buildModalStrip(post);
  renderModalSlide();
  document.getElementById('modalOverlay').classList.add('open');
}

function buildModalStrip(post) {
  const strip = document.getElementById('carouselStrip');
  strip.innerHTML = '';
  post.slides.forEach((sl, si) => {
    const wrap = document.createElement('div');
    wrap.className = `strip-thumb${si === state.modal.currentSlide ? ' active-slide' : ''}`;
    wrap.id = `strip-${si}`;
    const c = document.createElement('canvas'); c.width = 200; c.height = 200;
    wrap.appendChild(c);
    const lbl = document.createElement('div'); lbl.className = 'strip-label'; lbl.textContent = `Slide ${si+1}`;
    wrap.appendChild(lbl);
    wrap.onclick = () => { state.modal.currentSlide = si; renderModalSlide(); };
    strip.appendChild(wrap);
    drawSlide(c, sl, si, state.brand);
  });
}

function renderModalSlide() {
  const post = state.posts[state.modal.postIdx];
  const si = state.modal.currentSlide;
  drawSlide(document.getElementById('mainCanvas'), post.slides[si], si, state.brand);
  document.getElementById('slideCounter').textContent = `${si+1} / ${post.slides.length}`;
  document.getElementById('prevSlideBtn').disabled = si === 0;
  document.getElementById('nextSlideBtn').disabled = si === post.slides.length-1;
  document.querySelectorAll('.strip-thumb').forEach((el,i) => el.classList.toggle('active-slide', i===si));
}
function changeSlide(dir) {
  const post = state.posts[state.modal.postIdx];
  state.modal.currentSlide = Math.max(0, Math.min(post.slides.length-1, state.modal.currentSlide+dir));
  renderModalSlide();
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function closeModalOnBg(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function schedulePost() {
  const pi = state.modal.postIdx;
  const t = document.getElementById('scheduleTimeInput').value;
  if (!t) { toast('Pick a time first','info'); return; }
  state.posts[pi].scheduledTime = t;
  const dt = new Date(t);
  state.scheduledPosts.push({ postIdx: pi, time: dt, title: state.posts[pi].concept });
  renderScheduleQueue(); renderCalendar(); closeModal();
  toast(`Scheduled for ${dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} at ${dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} ✓`, 'success');
}

function downloadSlide() {
  const c = document.getElementById('mainCanvas');
  const link = document.createElement('a');
  link.download = `slide-${state.modal.currentSlide+1}.png`;
  link.href = c.toDataURL('image/png'); link.click();
  toast('Slide downloaded','info');
}
function downloadAll() {
  const post = state.posts[state.modal.postIdx];
  post.slides.forEach((sl, si) => {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1080;
    drawSlide(c, sl, si, state.brand);
    setTimeout(() => {
      const link = document.createElement('a');
      link.download = `slide-${si+1}.png`; link.href = c.toDataURL('image/png'); link.click();
    }, si * 200);
  });
  toast('Downloading all slides…','info');
}

   GENERATE
════════════════════════════════════════════════════ */
function generatePosts() {
  const prompt = document.getElementById('postPrompt').value.trim();
  const count  = parseInt(document.getElementById('countSelect').value);
  if (!prompt) { toast('Add a prompt first','info'); return; }
  const btn = document.getElementById('generateBtn');
  btn.disabled = true; btn.textContent = '⌛ Generating…';
  const list = document.getElementById('postsList'); list.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'shimmer'; s.style.cssText = 'height:72px;';
    list.appendChild(s);
  }
  setTimeout(() => {
    state.posts = generateIdeas(prompt, count);
    renderPosts(); btn.disabled = false; btn.textContent = '✦ Generate';
    toast(`${count} ideas generated ✦`, 'success');
  }, 1100 + Math.random() * 700);
}

function generateIdeas(prompt, count) {
  const kw = extractKeyword(prompt);
  const brand = state.brand.name;
  const templates = [
    { conceptFn: p=>`How ${brand} Is Changing ${extractKeyword(p)} Forever`,          tags:['#Innovation','#BrandStory','#WhyWeExist'],        slides:['cover','feature','stat','lifestyle','cta'] },
    { conceptFn: p=>`5 Things to Know Before Buying Your Next ${extractKeyword(p)}`,  tags:['#BuyingGuide','#Tips','#EducateFirst'],           slides:['cover','feature','feature','stat','cta'] },
    { conceptFn: p=>`The Minimal Way to ${extractAction(p)}`,                          tags:['#Lifestyle','#BrandVoice',`#${brand}`],          slides:['cover','lifestyle','lifestyle','feature','cta'] },
    { conceptFn: p=>`Behind the Brand: Our ${extractKeyword(p)} Story`,                tags:['#BTS','#Transparency','#FounderStory'],          slides:['cover','feature','feature','lifestyle','cta'] },
    { conceptFn: p=>`Why ${extractKeyword(p)} Matters More Than Ever in 2026`,         tags:['#ThoughtLeadership','#Industry','#Purpose'],     slides:['cover','stat','feature','stat','cta'] },
    { conceptFn: p=>`Real Talk: What Our Customers Say About ${extractKeyword(p)}`,    tags:['#SocialProof','#CustomerLove','#Reviews'],       slides:['cover','feature','stat','lifestyle','cta'] },
    { conceptFn: p=>`The ${brand} Guide to ${extractAction(p)} Better`,                tags:['#HowTo','#Tips','#ValueContent'],                slides:['cover','feature','feature','feature','cta'] },
    { conceptFn: p=>`Summer Mood: ${extractKeyword(p)} Edition`,                       tags:['#Seasonal','#Lifestyle','#MoodBoard'],           slides:['cover','lifestyle','lifestyle','stat','cta'] },
  ];
  const emojis = ['☀️','🌿','✨','🔥','💎','🌊','🎯','⚡','🌸','🏆','💫','🌱'];
  const subs = ['You need to see this', `Only at ${brand}`, 'Swipe to discover', 'The story continues →', 'See the full picture'];
  return Array.from({length: count}, (_, i) => {
    const t = templates[i % templates.length];
    const concept = t.conceptFn(prompt);
    const slides = t.slides.map((type, si) => ({
      type, emoji: emojis[(i*3+si) % emojis.length],
      headline: getHeadline(type, si, concept, prompt),
      sub: subs[si % subs.length]
    }));
    return {
      id: Date.now()+i, concept, tags: t.tags,
      caption: buildCaption(concept, prompt, t.tags),
      slides, status: 'ready', expanded: false, scheduledTime: null
    };
  });
}

function extractKeyword(p) {
  const skip = new Set(['a','an','the','and','or','to','for','in','on','our','their','is','are','we','how','should','about','from','with']);
  return p.split(' ').find(w => !skip.has(w.toLowerCase()) && w.length > 3) || 'product';
}
function extractAction(p) {
  const v = p.match(/\b(shop|buy|wear|live|work|move|run|walk|feel|look|find|choose|care|love|use)\b/i);
  return v ? v[0] : 'shop';
}
function getHeadline(type, si, concept, prompt) {
  const kw = extractKeyword(prompt);
  const h = { cover:`${concept.slice(0,24)}\n${concept.slice(24,46)||''}`, feature:`Why ${kw}\nMatters`, stat:`${Math.floor(Math.random()*50+50)}%`, lifestyle:`Your ${kw}\nMoment`, cta:`Get Yours\nToday` };
  return h[type] || `Slide ${si+1}`;
}
function buildCaption(concept, prompt, tags) {
  const kw = extractKeyword(prompt);
  return `${concept} 🔥\n\nHere's what you need to know about ${kw} — swipe through for the full story.\n\n→ Link in bio\n\n${tags.join(' ')} #${state.brand.name}`;
}

  setTimeout(() => {
    const key = Object.keys(brands).find(k => url.toLowerCase().includes(k));
    const b = brands[key] || { name:'Brand', primaryColor:'#111', accentColor:'#F04E00', bgColor:'#F6F2EC', font:'Georgia', vibes:['Minimal','Modern'], pg:[['#F04E00','#ff8150'],['#111','#333'],['#F6F2EC','#fff'],['#888','#aaa']] };
    state.brand.name = b.name; state.brand.primaryColor = b.primaryColor;
    state.brand.accentColor = b.accentColor; state.brand.bgColor = b.bgColor;
    state.brand.font = b.font; state.brand.vibes = b.vibes;
    state.brand.photos = b.pg.map((g,i) => ({gradient:g, label:`Photo ${i+1}`}));
    document.getElementById('brandMetaName').textContent = b.name;
    document.querySelector('.topbar-name').innerHTML = `Gen <span>${b.name}</span>`;
    btn.textContent = '→ Load'; btn.disabled = false;
    renderBrandPanel();
    toast(`Brand kit loaded: ${b.name} ✓`, 'success');
  }, 850);
}

function renderBrandPanel() {
  renderColorSwatches(); renderFontList(); renderVibeTags(); renderPhotosGrid();
}

function renderColorSwatches() {
  const colors = [state.brand.primaryColor, state.brand.bgColor, state.brand.accentColor,
    shiftColor(state.brand.accentColor, 30), shiftColor(state.brand.primaryColor, 60)];
  document.getElementById('colorSwatches').innerHTML =
    colors.map((c,i) => `
      <div class="swatch-wrap" onclick="selectColor(this,'${c}')">
        <div class="swatch${i===0?' selected':''}" style="background:${c}" title="${c}"></div>
        <span class="swatch-label">${c}</span>
      </div>`).join('') + `<div class="swatch-add" onclick="addColor()" title="Add">+</div>`;
}

function renderFontList() {
  const fonts = [{name:state.brand.font,role:'Heading'},{name:'Inter',role:'Body'},{name:'monospace',role:'Accent'}];
  document.getElementById('fontList').innerHTML = fonts.map((f,i) => `
    <div class="font-item${i===0?' active':''}" onclick="selectFont(this,'${f.name}')">
      <div class="font-meta">
        <span class="font-name-label">${f.name}</span>
        <span class="font-role-label">${f.role}</span>
      </div>
      <span class="font-preview-text" style="font-family:'${f.name}'">Aa</span>
    </div>`).join('');
}

function renderVibeTags() {
  const all = ['Minimal','Sustainable','Natural','Luxury','Bold','Playful','Earthy','Tech','Outdoor','Beauty','Athletic','Premium'];
  document.getElementById('vibeTags').innerHTML = all.map(v => `
    <span class="vibe-tag${state.brand.vibes.includes(v)?' active':''}" onclick="toggleVibe(this)">${v}</span>`).join('');
}

function renderPhotosGrid() {
  const grid = document.getElementById('photosGrid');
  grid.innerHTML = state.brand.photos.map((p,i) => `
    <div class="photo-item selected" onclick="togglePhoto(this,${i})" id="photo-${i}">
      <canvas id="photo-canvas-${i}" width="160" height="160"></canvas>
    </div>`).join('') + `
    <div class="photo-add" onclick="uploadPhoto()">
      <span class="photo-add-icon">+</span><span>Upload</span>
    </div>`;
  state.brand.photos.forEach((p,i) => {
    const c = document.getElementById(`photo-canvas-${i}`);
    if (!c) return;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0,0,160,160);
    g.addColorStop(0, p.gradient[0]); g.addColorStop(1, p.gradient[1]);
    ctx.fillStyle = g; ctx.fillRect(0,0,160,160);
    /* orange accent dot */
    ctx.fillStyle = hexToRgba(ORANGE, 0.5);
    ctx.fillRect(0,0,4,160);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = 'bold 11px Inter, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(p.label, 80, 130);
  });
}

function selectColor(el, hex) {
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
  el.querySelector('.swatch').classList.add('selected');
  state.brand.primaryColor = hex;
}
function addColor() {
  const inp = document.createElement('input'); inp.type = 'color'; inp.value = state.brand.accentColor;
  inp.addEventListener('change', e => { state.brand.accentColor = e.target.value; renderColorSwatches(); });
  inp.click();
}
function selectFont(el, name) {
  document.querySelectorAll('.font-item').forEach(f => f.classList.remove('active'));
  el.classList.add('active'); state.brand.font = name;
}
function toggleVibe(el) {
  el.classList.toggle('active');
  state.brand.vibes = Array.from(document.querySelectorAll('.vibe-tag.active')).map(t => t.textContent);
}
function togglePhoto(el) { el.classList.toggle('selected'); }
function uploadPhoto() {
  const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      state.brand.photos.push({src:ev.target.result, gradient:['#666','#999'], label:f.name.split('.')[0]});
      renderPhotosGrid(); toast('Photo uploaded ✓','success');
    };
    r.readAsDataURL(f);
  });
  inp.click();
}
function uploadFont() { toast('Use Google Fonts for custom typefaces','info'); }
function resetColors() { renderColorSwatches(); toast('Colours reset','info'); }

/* ════════════════════════════════════════════════════
   SCHEDULE QUEUE
════════════════════════════════════════════════════ */
function renderScheduleQueue() {
  const q = document.getElementById('scheduleQueue');
  if (!state.scheduledPosts.length) {
    q.innerHTML = `<div class="schedule-empty"><div class="schedule-empty-icon">📅</div>No posts scheduled yet.<br>Generate ideas and hit Schedule.</div>`;
    return;
  }
  q.innerHTML = state.scheduledPosts.map((sp,i) => {
    const post = state.posts[sp.postIdx]; if (!post) return '';
    const dt = new Date(sp.time);
    return `<div class="queue-item">
      <div class="queue-thumb"><canvas id="q-canvas-${i}" width="80" height="80"></canvas></div>
      <div class="queue-info">
        <div class="queue-title">${post.concept}</div>
        <div class="queue-time">${dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} · ${dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <div class="dot-green"></div>
    </div>`;
  }).join('');
  state.scheduledPosts.forEach((sp,i) => {
    const post = state.posts[sp.postIdx]; if (!post) return;
    const c = document.getElementById(`q-canvas-${i}`);
    if (c) drawSlide(c, post.slides[0], 0, state.brand);
  });
}

/* ════════════════════════════════════════════════════
   CALENDAR
════════════════════════════════════════════════════ */
function renderCalendar() {
  const {year, month} = state.calendar;
  const names = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('calMonth').textContent = `${names[month]} ${year}`;
  const days = new Date(year,month+1,0).getDate();
  const start = (new Date(year,month,1).getDay() + 6) % 7;
  const today = new Date();
  const sched = new Set(state.scheduledPosts.map(sp => {
    const d = new Date(sp.time);
    return (d.getFullYear()===year && d.getMonth()===month) ? d.getDate() : null;
  }).filter(Boolean));
  const headers = ['Mo','Tu','We','Th','Fr','Sa','Su'];
  let html = headers.map(d=>`<div class="cal-day-header">${d}</div>`).join('');
  for (let i=0;i<start;i++) html += `<div class="cal-day empty"></div>`;
  for (let d=1;d<=days;d++) {
    const isToday = today.getFullYear()===year && today.getMonth()===month && today.getDate()===d;
    html += `<div class="cal-day${isToday?' today':''} ${sched.has(d)?'has-post':''}">${d}</div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}
function prevMonth() { state.calendar.month--; if(state.calendar.month<0){state.calendar.month=11;state.calendar.year--;} renderCalendar(); }
function nextMonth() { state.calendar.month++; if(state.calendar.month>11){state.calendar.month=0;state.calendar.year++;} renderCalendar(); }

/* ════════════════════════════════════════════════════
   THEME TOGGLE
════════════════════════════════════════════════════ */
function toggleTheme() {
  const html = document.documentElement;
  const next = html.dataset.theme === 'light' ? 'dark' : 'light';
  html.dataset.theme = next;
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☽' : '☀';
}

/* ════════════════════════════════════════════════════
   MISC UI
════════════════════════════════════════════════════ */
function setView(btn, v) {
  document.querySelectorAll('.topbar-pills .pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  if (v !== 'carousel') toast(`${v[0].toUpperCase()+v.slice(1)} mode coming soon`,'info');
}
function selectPlatform(btn) {
  document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
function openScheduleAll() {
  if (!state.posts.length) { toast('Generate some posts first','info'); return; }
  toast('Open a carousel to schedule individual posts','info');
}

/* ════════════════════════════════════════════════════
   TOAST
════════════════════════════════════════════════════ */
function toast(msg, type='info') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.getElementById('toastContainer').appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 350); }, 3200);
}

/* ════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════ */
function init() {
  state.posts = JSON.parse(JSON.stringify(SAMPLE_POSTS));
  renderBrandPanel();
  renderPosts();
  renderCalendar();
  /* pre-loaded schedule entries */
  state.scheduledPosts.push({ postIdx:0, time:new Date(2026,5,25,9,0),  title:SAMPLE_POSTS[0].concept });
  state.scheduledPosts.push({ postIdx:2, time:new Date(2026,5,27,11,30),title:SAMPLE_POSTS[2].concept });
  renderScheduleQueue();
  renderCalendar();
}

init();
</script>
