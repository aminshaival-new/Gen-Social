<!DOCTYPE html>
<html lang="en" data-theme="pink">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen Social — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Themes ─────────────────────────────────────────────────── */
  :root,
  [data-theme="pink"] {
    --accent:  #FF2D6B;
    --bg:      #FFFFFF;
    --panel:   #FFF5F8;
    --text:    #1C1C1E;
    --muted:   #9B7888;
    --border:  #1C1C1E;
    --shadow:  4px 4px 0px #1C1C1E;
    --dot-bg:  rgba(255,45,107,0.07);
    --ph:      #c090a8;
    --err-bg:  #fff0f5;
  }

  [data-theme="noir"] {
    --accent:  #E8E8E8;
    --bg:      #0E0D0B;
    --panel:   #1C1A16;
    --text:    #F2EFE8;
    --muted:   #7A7060;
    --border:  #F2EFE8;
    --shadow:  4px 4px 0px #F2EFE8;
    --dot-bg:  rgba(242,239,232,0.05);
    --ph:      #5a5040;
    --err-bg:  #1C1A16;
  }

  [data-theme="graphite"] {
    --accent:  #4B5563;
    --bg:      #F9FAFB;
    --panel:   #F3F4F6;
    --text:    #111827;
    --muted:   #6B7280;
    --border:  #111827;
    --shadow:  4px 4px 0px #111827;
    --dot-bg:  rgba(75,85,99,0.06);
    --ph:      #9CA3AF;
    --err-bg:  #F3F4F6;
  }

  [data-theme="ocean"] {
    --accent:  #2563EB;
    --bg:      #F0F4FF;
    --panel:   #E0E9FF;
    --text:    #0F172A;
    --muted:   #5B6F9A;
    --border:  #0F172A;
    --shadow:  4px 4px 0px #0F172A;
    --dot-bg:  rgba(37,99,235,0.06);
    --ph:      #93AEDD;
    --err-bg:  #E0E9FF;
  }

  /* ── Base ───────────────────────────────────────────────────── */
  body {
    font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-image: radial-gradient(circle, var(--dot-bg) 1px, transparent 1px);
    background-size: 24px 24px;
    transition: background 0.25s, color 0.25s;
  }

  .card {
    background: var(--bg);
    border: 2px solid var(--border);
    box-shadow: var(--shadow);
    padding: 40px 40px 32px;
    width: 100%;
    max-width: 400px;
    transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .logo-mark {
    width: 38px;
    height: 38px;
    background: var(--accent);
    border: 2px solid var(--border);
    box-shadow: 2px 2px 0 var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    color: var(--bg);
    letter-spacing: -1px;
    transition: background 0.25s, border-color 0.25s;
  }

  .logo-name {
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.5px;
  }

  .logo-name .accent { color: var(--accent); transition: color 0.25s; }

  h1 {
    font-weight: 800;
    font-size: 26px;
    line-height: 1.15;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 11px 14px;
    font-family: inherit;
    font-size: 15px;
    background: var(--panel);
    border: 2px solid var(--border);
    color: var(--text);
    outline: none;
    margin-bottom: 16px;
    transition: box-shadow 0.15s, background 0.25s, border-color 0.25s;
  }

  input:focus { box-shadow: 3px 3px 0 var(--accent); }
  input::placeholder { color: var(--ph); }

  button[type="submit"] {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: var(--bg);
    border: 2px solid var(--border);
    box-shadow: var(--shadow);
    font-family: inherit;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s, background 0.25s;
    margin-top: 4px;
  }

  button[type="submit"]:hover {
    transform: translate(-1px, -1px);
    box-shadow: 5px 5px 0px var(--border);
  }

  button[type="submit"]:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0px var(--border);
  }

  button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: default;
    transform: none;
    box-shadow: var(--shadow);
  }

  .error {
    display: none;
    background: var(--err-bg);
    border: 2px solid var(--accent);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 14px;
    margin-bottom: 16px;
  }

  .error.visible { display: block; }

  /* ── Theme switcher ─────────────────────────────────────────── */
  .theme-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1.5px solid var(--border);
  }

  .theme-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    flex-shrink: 0;
  }

  .theme-swatches {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .swatch {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    cursor: pointer;
    position: relative;
    transition: transform 0.1s;
    flex-shrink: 0;
  }

  .swatch:hover { transform: translate(-1px, -1px); }

  .swatch.active::after {
    content: '';
    position: absolute;
    inset: -4px;
    border: 2px solid var(--border);
  }

  .footer {
    margin-top: 20px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-mark">G</div>
    <span class="logo-name">Gen <span class="accent">Social</span></span>
  </div>

  <h1>Sign in to<br>your studio</h1>
  <p class="subtitle">Enter your credentials to continue.</p>

  <div class="error" id="err"></div>

  <form id="form">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="username" autocomplete="username" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>

    <button type="submit" id="btn">Sign In →</button>
  </form>

  <div class="theme-row">
    <span class="theme-label">Theme</span>
    <div class="theme-swatches">
      <div class="swatch active" data-theme="pink"     style="background:#FF2D6B" title="Pink"></div>
      <div class="swatch"        data-theme="noir"     style="background:#0E0D0B" title="Noir"></div>
      <div class="swatch"        data-theme="graphite" style="background:#4B5563" title="Graphite"></div>
      <div class="swatch"        data-theme="ocean"    style="background:#2563EB" title="Ocean"></div>
    </div>
  </div>
</div>

<p class="footer">Gen Social · Content Creator</p>

<script>
  const form = document.getElementById('form');
  const btn  = document.getElementById('btn');
  const err  = document.getElementById('err');

  /* ── Theme switcher ── */
  const swatches = document.querySelectorAll('.swatch');
  const saved = localStorage.getItem('gs-theme') || 'pink';
  applyTheme(saved);

  swatches.forEach(sw => {
    sw.addEventListener('click', () => applyTheme(sw.dataset.theme));
  });

  function applyTheme(name) {
    document.documentElement.setAttribute('data-theme', name);
    swatches.forEach(sw => sw.classList.toggle('active', sw.dataset.theme === name));
    localStorage.setItem('gs-theme', name);
  }

  /* ── Login ── */
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    err.classList.remove('visible');

    try {
      const res = await fetch('/api/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        window.location.href = '/';
      } else {
        err.textContent = data.error || 'Sign in failed. Check your credentials.';
        err.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Sign In →';
      }
    } catch (_) {
      err.textContent = 'Could not reach the server. Try again.';
      err.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Sign In →';
    }
  });
</script>
</body>
</html>
